name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.1.0) publishes the images and deploys them.
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    services:
      # A real PostgreSQL for the end-to-end tests (docs/conventions.md B20).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mercurio
          POSTGRES_PASSWORD: mercurio
          POSTGRES_DB: mercurio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercurio -d mercurio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Owner role for migrations and test fixtures; mercurio_app for the API (docs/conventions.md B26).
      DATABASE_ADMIN_URL: postgresql://mercurio:mercurio@localhost:5432/mercurio
      POSTGRES_APP_PASSWORD: mercurio-app-ci-password
      DATABASE_URL: postgresql://mercurio_app:mercurio-app-ci-password@localhost:5432/mercurio
    steps:
      - uses: actions/checkout@v7
      # pnpm first: setup-node caches the pnpm store, so pnpm must already be on the PATH.
      # Its version comes from "packageManager" in package.json, as in the Dockerfile.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      # The web client is generated from the API's OpenAPI document: both files are committed,
      # so a change to the API that is not reflected in them fails here (docs/adr/0016).
      - name: Generated API client is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm db:setup
      - run: pnpm test:e2e
      - run: pnpm build

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mercurio
          POSTGRES_PASSWORD: mercurio
          POSTGRES_DB: mercurio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercurio -d mercurio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://mercurio:mercurio@localhost:5432/mercurio
      POSTGRES_APP_PASSWORD: mercurio-app-ci-password
      DATABASE_URL: postgresql://mercurio_app:mercurio-app-ci-password@localhost:5432/mercurio
      # Throwaway secrets for this job only.
      AUTH_JWT_SECRET: ci-browser-tests-jwt-secret-0123456789abcdef
      MFA_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm db:setup
      # The same build as production: the API serves the web app under /mercurio.
      - run: pnpm --filter @mercurio/api build
      - run: pnpm --filter @mercurio/web build
        env:
          APP_BASE_PATH: /mercurio
      - run: pnpm --filter @mercurio/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mercurio/web test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: [check, browser]
    permissions:
      contents: read
      # Only this job can publish to GitHub Container Registry.
      packages: write
    env:
      # Pull requests only prove that the images build; pushes to main and tags publish them.
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags: "0.1.0" for a version tag, "sha-1a2b3c4" for every published commit,
      # "latest" for the head of main. The deployment picks one of them explicitly.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/micheleg14/mercurio
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/micheleg14/mercurio-migrate
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # The version shown by /api/health: the tag for a release, the short commit otherwise.
      - id: version
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BASE_PATH=/mercurio
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The migration image reuses the build stages cached by the step above.
      - uses: docker/build-push-action@v7
        if: env.PUBLISH == 'true'
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          build-args: |
            APP_BASE_PATH=/mercurio
          cache-from: type=gha

  deploy:
    name: Deploy
    needs: docker
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
