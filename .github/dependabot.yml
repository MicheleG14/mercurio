# Keeps dependencies monitored (docs/conventions.md B24). Minor and patch updates are grouped
# so they arrive as one weekly pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js major we run (.node-version), not the newest Node.js.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7.0 ships no compiler API, which the Nest CLI needs; it returns in 7.1.
      - dependency-name: typescript
        versions: ['7.0.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
