# Production. The images are built and published by CI (GitHub Container Registry);
# the server only pulls them: see deploy/deploy.sh. nginx on the host proxies /mercurio/
# to 127.0.0.1:8001.
#
# The `build` sections let you build and try the same images locally:
#   APP_VERSION=local docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
name: mercurio-prod

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    # No published port: only the containers on this Compose network reach the database.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ghcr.io/micheleg14/mercurio-migrate:${APP_VERSION:?set APP_VERSION, e.g. 0.1.0}
    build:
      context: .
      target: migrator
    # Owner role: applies the migrations, then lets mercurio_app log in (scripts/provision-app-role.mjs).
    environment:
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env.production}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    <<: *hardening

  app:
    image: ghcr.io/micheleg14/mercurio:${APP_VERSION:?set APP_VERSION, e.g. 0.1.0}
    build:
      context: .
      target: runtime
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/mercurio}
        APP_VERSION: ${APP_VERSION}
    restart: unless-stopped
    environment:
      # mercurio_app, subject to Row-Level Security: the API never gets the owner's credentials.
      DATABASE_URL: postgresql://mercurio_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env.production}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Localhost only: nginx is the single public entry point.
      - '127.0.0.1:8001:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening

volumes:
  db-data:
