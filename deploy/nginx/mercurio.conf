# Mercurio, served under the /mercurio/ path of the host's domain.
# Install it as /etc/nginx/apps.d/mercurio.conf: the domain's server block includes apps.d/*.conf.
# It relies on /etc/nginx/snippets/proxy-headers.conf (standard proxy headers).
# The app runs in Docker on 127.0.0.1:8001 and knows its own /mercurio prefix: no path rewriting here.

location = /mercurio {
    return 301 /mercurio/;
}

location /mercurio/ {
    proxy_pass http://127.0.0.1:8001;
    include snippets/proxy-headers.conf;
    # Same id in nginx and application logs.
    proxy_set_header X-Request-Id $request_id;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # The server default (500M) exists for libreria's PDFs; Mercurio needs far less.
    client_max_body_size 10m;
}
